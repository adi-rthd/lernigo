name: Deploy Lernigo

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check commit messages
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.marker.outputs.deploy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for the dp marker
        id: marker
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE" == 0000000000000000000000000000000000000000 ]]; then
            range="$GITHUB_SHA^!"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA^!"
          fi

          match=$(git log "$range" --extended-regexp \
            --grep='(^|[^[:alnum:]_])dp([^[:alnum:]_]|$)' -1 --format=%H)
          if [[ -n "$match" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to the Lernigo VPS
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lernigo-vps-production
      cancel-in-progress: false
    steps:
      - name: Run the VPS deploy command
        env:
          DEPLOY_HOST: ${{ vars.LERNIGO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.LERNIGO_DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.LERNIGO_DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.LERNIGO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LERNIGO_DEPLOY_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?Set LERNIGO_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set LERNIGO_DEPLOY_USER}"
          : "${DEPLOY_KEY:?Set LERNIGO_DEPLOY_SSH_KEY}"
          : "${KNOWN_HOSTS:?Set LERNIGO_DEPLOY_KNOWN_HOSTS}"

          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          ssh -nT -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -i "$ssh_dir/key" -p "${DEPLOY_PORT:-22}" -l "$DEPLOY_USER" -- "$DEPLOY_HOST" \
            "deploy-lernigo $GITHUB_SHA"
